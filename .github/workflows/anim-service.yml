name: Anim service

# The optional processing service for animated photos (services/anim). Runs its tests, then publishes
#   ghcr.io/<owner>/gleam-anim-service:<branch>, :sha-<commit>, and :latest on the default branch.
# Only runs when the service changes; the image carries ~490 MB of model weights, downloaded during the build.
on:
  push:
    branches: ["**"]
    paths: ["services/anim/**", ".github/workflows/anim-service.yml"]
  pull_request:
    paths: ["services/anim/**", ".github/workflows/anim-service.yml"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tests
        uses: docker/build-push-action@v6
        with:
          context: services/anim
          target: test
          push: false
          cache-from: type=gha,scope=anim
          cache-to: type=gha,scope=anim,mode=max
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gleam-anim-service" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/anim
          target: final
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=anim
          cache-to: type=gha,scope=anim,mode=max
