# Portainer stack for one website. The same image runs every site: deploy this stack once per site, each with its
# own stack name, THEME, BASE_URL, admin account and Cloudflare tunnel. Portainer prefixes volumes with the stack
# name, so every site automatically gets its own database and photos.
# Pulls the image GitHub Actions publishes to ghcr.io; nothing is built on the server.
# Public access is through a Cloudflare Tunnel (cloudflared): no ports are published on the host.
# In the Cloudflare dashboard, point the tunnel's public hostname at http://web:8080.
# Paste into Portainer > Stacks > Add stack > Web editor, then add the variables from stack.env
# (Environment variables > Advanced mode, or "Load variables from .env file").
#
# Everything editors change (words, photos, accounts, messages) is stored in the site-data volume.
# Back that volume up; the image itself holds no content.

services:
  web:
    image: ghcr.io/andycqos74/gleam-site-engine:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      THEME: ${THEME:-qos}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_RESET: ${ADMIN_RESET:-false}
      BASE_URL: ${BASE_URL}
      CONTACT_TO: ${CONTACT_TO:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      VOICE_API_TOKEN: ${VOICE_API_TOKEN:-}
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      UMAMI_API_URL: ${UMAMI_API_URL:-}
      UMAMI_SCRIPT_NAME: ${UMAMI_SCRIPT_NAME:-script.js}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Visitor chat assistant (Claude). Off until a key is set; each site then turns it on and writes its own
      # instructions under Admin > Chat assistant.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5-5}
      ASSISTANT_EFFORT: ${ASSISTANT_EFFORT:-medium}
    volumes:
      - site-data:/data
      # A custom theme kept on the server instead of built into the image: uncomment, set THEME to its folder name,
      # and point the left-hand path at the theme folder on the host.
      # - /opt/site-themes/mytheme:/app/themes/mytheme:ro
    # Not using a tunnel? Remove the cloudflared service and publish a port for your reverse proxy instead:
    # ports:
    #   - "127.0.0.1:8081:8080"

  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy

volumes:
  site-data:
